<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Super Neira Bro</title>
<meta name="description" content="Plataformas 3D: elige personaje, recorre dieciséis mundos distintos, métete en los tubos para jugar minijuegos, dispara tuercas y derrota a los jefes finales.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f8cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Pantalla completa 3D; cruceta abajo a la izquierda, SALTO y TUERCA abajo a la derecha; HUD y botones arriba; menús en tarjeta central. */
:root{
  --night:#1d2b4f; --steel:#c9d3de; --amber:#ffb627; --rust:#d9572b; --ink:#0d121b;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--steel);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0}
#wrap canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--pixel);font-size:clamp(8px,2.2vw,11px);line-height:1.6;color:#fff;text-shadow:2px 2px 0 var(--ink);pointer-events:none}
#hud b{color:var(--amber);font-weight:400}
#hud b.warn{color:#ff5a3c;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 34px);font-family:var(--pixel);font-size:9px;padding:8px 10px;border:2px solid rgba(255,255,255,.5);background:rgba(13,18,27,.45);color:#fff;border-radius:6px;z-index:4}
.tb:focus-visible{outline:2px solid var(--amber)}
#full{left:max(16px,env(safe-area-inset-left,0px))}
#music{right:max(16px,env(safe-area-inset-right,0px))}
#quality{top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,env(safe-area-inset-right,0px))}
#pause{left:50%;transform:translateX(-50%);z-index:2}
#bossbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);width:min(52vw,340px);font-family:var(--pixel);font-size:9px;color:#fff;text-align:center;text-shadow:2px 2px 0 var(--ink);pointer-events:none}
#bossbar .bar{height:12px;border:2px solid #fff;background:rgba(13,18,27,.6);margin-top:5px;border-radius:3px;overflow:hidden}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a5a,#d9312b);transition:width .25s}
.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:14px;align-items:flex-end}
#left{left:max(18px,env(safe-area-inset-left,0px))}
#right{right:max(18px,env(safe-area-inset-right,0px))}
.btn{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(13,18,27,.35);color:#fff;font-family:var(--pixel);font-size:20px;display:grid;place-items:center;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px)}
.btn.on{background:rgba(255,182,39,.55);border-color:var(--amber)}
#jump{width:88px;height:88px;font-size:12px;background:rgba(217,87,43,.42);border-color:rgba(255,200,170,.7)}
#dpad{position:relative;width:150px;height:150px;touch-action:none;-webkit-tap-highlight-color:transparent}
#dpad i{position:absolute;width:50px;height:50px;box-sizing:border-box;background:rgba(13,18,27,.5);border:3px solid rgba(255,255,255,.6);color:#fff;display:grid;place-items:center;font-style:normal;font-size:17px;font-family:var(--pixel);pointer-events:none}
#dpad .u{left:50px;top:0;border-radius:12px 12px 0 0;border-bottom:0}
#dpad .l{left:0;top:50px;border-radius:12px 0 0 12px;border-right:0}
#dpad .r{right:0;top:50px;border-radius:0 12px 12px 0;border-left:0}
#dpad .d{left:50px;bottom:0;border-radius:0 0 12px 12px;border-top:0}
#dpad .c{left:50px;top:50px;border:0;border-radius:0;background:rgba(13,18,27,.5)}
#dpad i.on{background:rgba(255,182,39,.65);border-color:var(--amber)}
.card .lv{width:min(44rem,94vw);grid-template-columns:repeat(4,1fr);gap:7px;max-height:72vh;overflow-y:auto}.card .lv button{padding:8px 9px;font-size:9px;gap:4px}.card .lv button small{font-size:7px}
#fire{width:66px;height:66px;font-size:8px;background:rgba(255,182,39,.32);border-color:rgba(255,230,160,.75);margin-bottom:44px}
.ft{position:fixed;font-family:var(--pixel);font-size:10px;color:#fff;text-shadow:2px 2px 0 var(--ink);pointer-events:none;transform:translate(-50%,-50%);animation:ft .9s ease-out forwards;white-space:nowrap;z-index:3}
.ft.big{font-size:14px;color:var(--amber)}
@keyframes ft{to{transform:translate(-50%,-180%);opacity:0}}
#banner{position:fixed;top:36%;left:0;right:0;text-align:center;font-family:var(--pixel);font-size:clamp(14px,4vw,22px);line-height:1.5;color:var(--amber);text-shadow:3px 3px 0 var(--rust),6px 6px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .3s;padding:0 16px}
#banner small{display:block;font-size:.55em;color:#fff;text-shadow:2px 2px 0 var(--ink)}
#banner.show{opacity:1}
#tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(30rem,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;z-index:6;background:#0d121b;border:3px solid var(--amber);box-shadow:6px 6px 0 var(--ink);padding:18px;display:grid;gap:14px;justify-items:center;text-align:center}
#tip p{font-family:var(--pixel);font-size:10px;line-height:1.9;margin:0;color:#fff}
#tip b{color:var(--amber);font-weight:400}
#tip button{font-family:var(--pixel);font-size:12px;padding:12px 18px;border:3px solid var(--ink);background:var(--amber);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(13,18,27,.55),rgba(13,18,27,.85));padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:3}
#overlay.sel{background:linear-gradient(rgba(13,18,27,0) 40%,rgba(13,18,27,.88));align-items:end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.card{text-align:center;display:grid;gap:14px;justify-items:center;max-width:40rem}
.card h1{font-family:var(--pixel);font-weight:400;font-size:clamp(22px,6vw,46px);line-height:1.25;margin:0;color:var(--amber);text-shadow:4px 4px 0 var(--rust),8px 8px 0 var(--ink);text-wrap:balance}
.card h2{font-family:var(--pixel);font-weight:400;font-size:clamp(14px,3.4vw,22px);margin:0;color:var(--amber);text-shadow:3px 3px 0 var(--ink)}
.card p{font-family:var(--pixel);font-size:11px;line-height:1.9;margin:0;color:var(--steel)}
.card button{font-family:var(--pixel);font-size:13px;padding:14px 20px;border:3px solid var(--ink);background:var(--amber);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.card button.alt{background:#c9d3de}
.card button:disabled{background:#4a5468;color:#8b93a1;cursor:default}
.card button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.small{opacity:.75;font-size:9px!important}
.who{display:grid;gap:8px;min-width:15rem}
.who b{font-family:var(--pixel);font-weight:400;font-size:18px;color:#fff;text-shadow:3px 3px 0 var(--ink)}
.stars{font-family:var(--pixel);font-size:10px;color:var(--steel);display:grid;grid-template-columns:auto auto;gap:6px 12px;justify-content:center;text-align:left}
.stars span:nth-child(even){color:var(--amber);letter-spacing:2px}
.arrow{width:54px;height:54px;padding:0!important;font-size:18px!important}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.5rem,1fr));gap:10px;width:min(56rem,100%)}
.lv button{display:grid;gap:6px;text-align:left;padding:12px 14px;font-size:11px;line-height:1.4}
.lv button small{font-size:8px;opacity:.8}
</style>
</head>
<body>
<div id="wrap"></div>
<div id="hud"><span><span id="who">NEIRA</span> x<b id="lives">3</b></span><span>TUERCAS <b id="nuts">0</b></span><span>PUNTOS <b id="score">0</b></span><span>MUNDO <b id="world">1-1</b></span><span>TIEMPO <b id="time">200</b></span></div>
<button class="tb" id="full" type="button">⛶ PANTALLA COMPLETA</button>
<button class="tb" id="pause" type="button" hidden>❚❚ PAUSA</button>
<button class="tb" id="music" type="button">♪ MÚSICA: SÍ</button>
<button class="tb" id="quality" type="button">✦ GRÁFICOS: ALTA</button>
<div id="bossbar" hidden><span id="bossname">JEFE</span><div class="bar"><i id="bosshp"></i></div></div>
<div id="banner"></div>
<div id="tip" hidden><p id="tiptext"></p><button id="tipok" type="button">ENTENDIDO</button></div>
<div class="pad" id="left"><div id="dpad" aria-label="Cruceta"><i class="u"></i><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i><i class="c"></i></div></div>
<div class="pad" id="right"><div class="btn" id="fire" aria-label="Disparar tuerca">TUERCA</div><div class="btn" id="jump" aria-label="Saltar">SALTO</div></div>
<div id="overlay"><div class="card" id="card"><h1>SUPER NEIRA BRO</h1><p>Cargando…</p></div></div>

<script src="js/three.min.js"></script>
<script src="js/CopyShader.js"></script>
<script src="js/LuminosityHighPassShader.js"></script>
<script src="js/FXAAShader.js"></script>
<script src="js/EffectComposer.js"></script>
<script src="js/MaskPass.js"></script>
<script src="js/RenderPass.js"></script>
<script src="js/ShaderPass.js"></script>
<script src="js/UnrealBloomPass.js"></script>
<script>
/* gestión de color correcta: los colores se escriben en sRGB y se convierten a lineal (si no, todo sale lavado) */
(function(){const C=THREE.Color.prototype,sh=C.setHex,sl=C.setHSL;
  C.setHex=function(h){sh.call(this,h);return this.convertSRGBToLinear()};
  C.setHSL=function(h,s,l){sl.call(this,h,s,l);return this.convertSRGBToLinear()}})();

const T=16,ROWS=14;
const SOLID=new Set(['#','B','T','U','D','S','P','R','G','<','>','I','J','Q']);
const TIME_TICK=30,LIFE_NUTS=50;
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
let COLS=232;
const wx=px=>px/T, wy=py=>ROWS-py/T;

/* ================= RENDER 3D ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
$('wrap').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,400);

function canTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
function rep(tex,x,y){const t=tex.clone();t.repeat.set(x,y);t.needsUpdate=true;return t}
function grad(stops){return(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);stops.forEach(([o,c])=>gr.addColorStop(o,c));g.fillStyle=gr;g.fillRect(0,0,w,h)}}

const pmrem=new THREE.PMREMGenerator(renderer);
const hemi=new THREE.HemisphereLight(0xdff1ff,0x6aa548,.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d8,1.65);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=3;
Object.assign(sun.shadow.camera,{left:-15,right:15,top:11,bottom:-4,near:1,far:60});sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;
scene.add(sun);scene.add(sun.target);
const rim=new THREE.DirectionalLight(0xbfe0ff,.5);rim.position.set(-10,8,-12);scene.add(rim);
/* linterna del personaje: se enciende en cueva y fábrica (siempre existe para no recompilar sombreadores) */
const heroLamp=new THREE.PointLight(0xffe2b0,0,14,1.6);scene.add(heroLamp);

/* ================= CALIDAD DE IMAGEN: posprocesado ================= */
/* bloom (brillo en tuercas, cristales, lava), tonemapping ACES, saturación, viñeta y FXAA */
const GradeShader={uniforms:{tDiffuse:{value:null},exposure:{value:.82},sat:{value:1.22},vig:{value:.28},warm:{value:new THREE.Vector3(1.03,1.0,.96)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float exposure,sat,vig;uniform vec3 warm;varying vec2 vUv;
  vec3 fit(vec3 v){vec3 a=v*(v+.0245786)-.000090537;vec3 b=v*(.983729*v+.4329510)+.238081;return a/b;}
  vec3 aces(vec3 c){const mat3 I=mat3(vec3(.59719,.07600,.02840),vec3(.35458,.90834,.13383),vec3(.04823,.01566,.83777));
    const mat3 O=mat3(vec3(1.60475,-.10208,-.00327),vec3(-.53108,1.10813,-.07276),vec3(-.07367,-.00605,1.07602));
    c*=exposure/.6;return clamp(O*fit(I*c),0.,1.);}
  vec3 toSRGB(vec3 c){return mix(pow(c,vec3(.41666))*1.055-.055,c*12.92,vec3(lessThanEqual(c,vec3(.0031308))));}
  void main(){vec3 c=aces(texture2D(tDiffuse,vUv).rgb*warm);c=toSRGB(c);
    float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,sat);
    float d=distance(vUv,vec2(.5));c*=1.-vig*smoothstep(.45,.95,d);
    gl_FragColor=vec4(clamp(c,0.,1.),1.);}`};
let composer=null,bloomPass=null,fxaaPass=null,gradePass=null,curExposure=.82;
const POST_OK=!!(THREE.EffectComposer&&THREE.RenderPass&&THREE.ShaderPass&&THREE.UnrealBloomPass&&THREE.FXAAShader);
let quality=store.get('snb-q')||'alta';
function setupPost(){
  if(!POST_OK||quality!=='alta'){composer=null;gradePass=null;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=curExposure;return}
  const gl=renderer.getContext();let rt;
  if(renderer.capabilities.isWebGL2&&gl.getExtension('EXT_color_buffer_float'))
    rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,format:THREE.RGBAFormat,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
  composer=new THREE.EffectComposer(renderer,rt);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.45,2.5);composer.addPass(bloomPass);
  gradePass=new THREE.ShaderPass(GradeShader);gradePass.uniforms.exposure.value=curExposure;composer.addPass(gradePass);
  fxaaPass=new THREE.ShaderPass(THREE.FXAAShader);composer.addPass(fxaaPass);
  renderer.toneMapping=THREE.NoToneMapping}
function setExposure(e,warm){curExposure=e;renderer.toneMappingExposure=e;if(gradePass){gradePass.uniforms.exposure.value=e;if(warm)gradePass.uniforms.warm.value.set(...warm)}
  GradeShader.uniforms.warm.value.set(...(warm||[1.03,1,.96]))}
function applyQuality(){
  const hi=quality==='alta';
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,hi?2:1.25));
  sun.shadow.mapSize.set(hi?2048:1024,hi?2048:1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
  renderer.shadowMap.type=hi?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;
  setupPost();$('quality').textContent='✦ GRÁFICOS: '+quality.toUpperCase();
  if(typeof resize==='function')resize()}

/* ================= TEXTURAS COMPARTIDAS ================= */
const T_box=canTex(64,64,(g)=>{g.fillStyle='#c4361c';g.fillRect(0,0,64,64);g.fillStyle='#8e2310';g.fillRect(0,24,64,4);g.fillRect(0,0,64,3);g.fillRect(0,61,64,3);g.fillStyle='#d8dde4';g.fillRect(28,22,8,9);g.fillStyle='#fff';
  g.save();g.translate(32,46);g.rotate(-.7);g.fillRect(-14,-3,22,6);g.beginPath();g.arc(12,0,7,0,7);g.fill();g.fillStyle='#c4361c';g.fillRect(12,-3,8,6);g.restore()});
const T_power=canTex(64,64,(g)=>{g.fillStyle='#ffb627';g.fillRect(0,0,64,64);g.fillStyle='#c27a00';g.fillRect(0,0,64,4);g.fillRect(0,60,64,4);g.fillRect(0,0,4,64);g.fillRect(60,0,4,64);
  g.fillStyle='#16161a';g.beginPath();g.arc(32,40,17,Math.PI,0);g.fill();g.fillRect(10,39,44,6);g.fillStyle='#ffe28a';g.fillRect(29,24,6,15);g.fillStyle='#fff';[[8,8],[56,8],[8,56],[56,56]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,2.5,0,7);g.fill()})});
const T_used=canTex(64,64,(g)=>{g.fillStyle='#596170';g.fillRect(0,0,64,64);g.fillStyle='#3d434e';g.fillRect(0,0,64,4);g.fillRect(0,60,64,4);g.fillStyle='#8b93a1';[[8,8],[52,8],[8,52],[52,52]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,4,0,7);g.fill()})});
const T_crate=canTex(64,64,(g)=>{g.fillStyle='#7a5328';g.fillRect(0,0,64,64);for(let i=0;i<4;i++){g.fillStyle=`hsl(30,${rnd(40,50)}%,${rnd(38,46)}%)`;g.fillRect(4,4+i*14,56,12)}g.fillStyle='#5a3a18';g.fillRect(0,0,64,5);g.fillRect(0,59,64,5);g.fillRect(0,0,5,64);g.fillRect(59,0,5,64);g.save();g.translate(32,32);g.rotate(.78);g.fillRect(-42,-4,84,8);g.restore()});
const T_hazard=canTex(64,16,(g)=>{g.fillStyle='#ffb627';g.fillRect(0,0,64,16);g.fillStyle='#16161a';for(let i=-2;i<5;i++){g.beginPath();g.moveTo(i*16,16);g.lineTo(i*16+8,16);g.lineTo(i*16+16,0);g.lineTo(i*16+8,0);g.fill()}});
const T_win=canTex(64,64,(g)=>{g.fillStyle='#000';g.fillRect(0,0,64,64);for(let y=0;y<4;y++)for(let x=0;x<4;x++){if(Math.random()<.45){g.fillStyle=Math.random()<.7?'#ffcf6e':'#9ec9ff';g.fillRect(x*16+4,y*16+4,8,9)}}});
const T_flag=canTex(64,48,(g)=>{for(let y=0;y<6;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?'#111':'#fff';g.fillRect(x*8,y*8,8,8)}});
const T_door=canTex(128,128,(g)=>{g.fillStyle='#8f97a3';g.fillRect(0,0,128,128);for(let i=0;i<16;i++){g.fillStyle=i%2?'#7b838f':'#a4acb8';g.fillRect(0,i*8,128,6)}});
const T_sign=canTex(512,96,(g)=>{g.fillStyle='#c4361c';g.fillRect(0,0,512,96);g.strokeStyle='#ffb627';g.lineWidth=8;g.strokeRect(6,6,500,84);g.fillStyle='#fff';g.font='bold 54px "Arial Black",Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('TALLER NEIRA',256,52)});

function mk(geo,mat,cast=true,recv=true){const m=new THREE.Mesh(geo,mat);m.castShadow=cast;m.receiveShadow=recv;return m}
function roundBox(w,h,d,r,seg){const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg);const p=g.attributes.position,n=g.attributes.normal,v=new THREE.Vector3(),i=new THREE.Vector3();
  const hx=w/2-r,hy=h/2-r,hz=d/2-r;for(let k=0;k<p.count;k++){v.fromBufferAttribute(p,k);i.set(Math.max(-hx,Math.min(hx,v.x)),Math.max(-hy,Math.min(hy,v.y)),Math.max(-hz,Math.min(hz,v.z)));
  const dir=v.clone().sub(i).normalize();v.copy(i).addScaledVector(dir,r);p.setXYZ(k,v.x,v.y,v.z);n.setXYZ(k,dir.x,dir.y,dir.z)}p.needsUpdate=true;n.needsUpdate=true;return g}

function makeNut(scale=1,mat=M.gold){const g=new THREE.Group();const b=mk(G.nut,mat,true,false);b.rotation.x=Math.PI/2;g.add(b);const h=mk(G.nutHole,M.black,false,false);h.rotation.x=Math.PI/2;g.add(h);g.scale.setScalar(scale);return g}

function decoMeadow(grp,lv){
  const hillCols=[0x6fd04a,0x58bf3c,0x86dc5c,0x4fae36,0x9be070];
  for(let x=-30;x<COLS+50;x+=rnd(6,12)){const r=rnd(5,12),z=-rnd(14,30);const h=new THREE.Mesh(G.sph,new THREE.MeshStandardMaterial({color:pick(hillCols),roughness:.85}));
    h.scale.set(r*rnd(1,1.6),r*rnd(.6,.9),r);h.position.set(x,1,z);h.receiveShadow=true;grp.add(h)}
  mesas(grp,[0xf6b8cf,0xf7cba0,0xcbb8f6,0xa8d8f6],0x7fd45a);
  clouds(grp,0xffffff,.35,13,20);
  const carCols=[0xd9572b,0x2f6fd6,0xe8e8e8,0x2a9d6a,0xffb627];
  for(let x=6;x<COLS-30;x+=rnd(10,18)){const k=Math.random();const z=-rnd(4,7);
    if(k<.22)grp.add(car(x,z,pick(carCols),true));
    else if(k<.42)tireStack(grp,x,z);
    else grp.add(tree(x,z,[0x2f9a52,0x3aaa48,0x2a8c6a]))}
  sunBall(grp,0xfff8d0,9,14,-150);
}
function decoCave(grp,lv){
  /* pared del fondo, columnas de roca, estalactitas, cristales y entibados de mina */
  const wallM=new THREE.MeshStandardMaterial({map:rep(THEMES.cave._rock,COLS/6,3),roughness:1,color:0xb8c8f0,emissive:0x0a1a3a,emissiveIntensity:.6});
  const wall=mk(new THREE.PlaneGeometry(COLS+80,30),wallM,false,true);wall.position.set(COLS/2,8,-22);grp.add(wall);
  const roof=mk(new THREE.PlaneGeometry(COLS+80,24),new THREE.MeshStandardMaterial({color:0x10131c,roughness:1}),false,true);roof.rotation.x=Math.PI/2;roof.position.set(COLS/2,12.02,-12);grp.add(roof);

function pine(x,z,s=1){const t=new THREE.Group();const tr=mk(new THREE.CylinderGeometry(.15*s,.22*s,1.2*s,8),new THREE.MeshStandardMaterial({color:0x5a3a20,roughness:.9}));tr.position.y=.6*s;t.add(tr);
  const gm=new THREE.MeshStandardMaterial({color:pick([0x1f5a3a,0x24663f,0x1a4f35]),roughness:.85}),sm=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7});
  for(let i=0;i<3;i++){const r=(1.3-i*.32)*s,h=(1.5-i*.25)*s,y=(1.1+i*.9)*s;const c=mk(G.cone,gm);c.scale.set(r,h,r);c.position.y=y+h/2;t.add(c);const sc=mk(G.cone,sm,false);sc.scale.set(r*.62,h*.45,r*.62);sc.position.y=y+h*.78;t.add(sc)}
  t.position.set(x,2,z);return t}
function palm(x,z,s=1){const p=new THREE.Group();const tm=new THREE.MeshStandardMaterial({color:0x9a6a3a,roughness:.9});let px=0,py=0;const lean=rnd(-.25,.25);
  for(let i=0;i<6;i++){const seg=mk(new THREE.CylinderGeometry(.16*s,.2*s,.75*s,10),tm);px+=lean*.25*s;py+=.7*s;seg.position.set(px,py,0);seg.rotation.z=-lean*.6;p.add(seg)}
  const lm=new THREE.MeshStandardMaterial({color:pick([0x2f9a3a,0x3aaa48,0x2a8c4a]),roughness:.7,side:THREE.DoubleSide});
  for(let i=0;i<7;i++){const hold=new THREE.Group();hold.position.set(px,py+.1*s,0);hold.rotation.y=i/7*Math.PI*2+rnd(-.2,.2);const lf=mk(new THREE.ConeGeometry(.35*s,2.4*s,4),lm);lf.scale.set(1,1,.18);lf.rotation.z=-1.95;lf.position.set(1.1*s,-.25*s,0);hold.add(lf);p.add(hold)}
  for(let i=0;i<3;i++){const c=mk(new THREE.SphereGeometry(.14*s,10,8),new THREE.MeshStandardMaterial({color:0x5a3a1a,roughness:.6}));c.position.set(px+rnd(-.2,.2),py-.2*s,rnd(-.2,.2));p.add(c)}
  p.position.set(x,2,z);return p}
function ocean(grp,col,y){const m=new THREE.MeshStandardMaterial({color:col,map:rep(T_wave,(COLS+400)/6,30),roughness:.55,metalness:0,envMapIntensity:.25});
  const o=mk(new THREE.PlaneGeometry(COLS+400,180),m,false,true);o.rotation.x=-Math.PI/2;o.position.set(COLS/2,y,-115);grp.add(o);grp.userData.ocean=m.map}
function decoSnow(grp){
  const mm=new THREE.MeshStandardMaterial({color:0x7d93b8,roughness:.9}),cm=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6});
  for(let x=-40;x<COLS+80;x+=rnd(18,30)){const r=rnd(10,18),h=rnd(16,28),z=-rnd(55,78);const m=new THREE.Mesh(G.cone,mm);m.scale.set(r,h,r);m.position.set(x,h/2,z);grp.add(m);
    const c=new THREE.Mesh(G.cone,cm);c.scale.set(r*.42,h*.42,r*.42);c.position.set(x,h-h*.21+.05,z);grp.add(c)}
  for(let x=-30;x<COLS+50;x+=rnd(7,12)){const r=rnd(5,11);const h=new THREE.Mesh(G.sph,new THREE.MeshStandardMaterial({color:pick([0xf4f9ff,0xe6f0fb,0xdbe8f6]),roughness:.8}));h.scale.set(r*rnd(1.2,1.7),r*rnd(.5,.75),r);h.position.set(x,1,-rnd(16,32));h.receiveShadow=true;grp.add(h)}
  clouds(grp,0xffffff,.3,14,21);
  for(let x=3;x<COLS-20;x+=rnd(3,7)){const k=Math.random(),z=-rnd(3,12);
    if(k<.7)grp.add(pine(x,z,rnd(.8,1.4)));
    else if(k<.82){const s=new THREE.Group();[[.55,.55],[.4,1.35],[.28,1.95]].forEach(([r,y])=>{const b=mk(new THREE.SphereGeometry(r,16,12),cm);b.position.y=y;s.add(b)});
      const n=mk(new THREE.ConeGeometry(.07,.35,8),new THREE.MeshStandardMaterial({color:0xff8a1a}));n.rotation.x=Math.PI/2;n.position.set(0,1.95,.38);s.add(n);s.position.set(x,2,z);grp.add(s)}
    else{const col=0x8fe8ff;const m=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.8,roughness:.1,transparent:true,opacity:.85});for(let i=0;i<3;i++){const c=new THREE.Mesh(G.oct,m);const s=rnd(.2,.45);c.scale.set(s*.6,s*1.8,s*.6);c.position.set(x+rnd(-.4,.4),2+s,z);c.rotation.z=rnd(-.4,.4);grp.add(c)}}}

function decoVolcano(grp){

/* Cada nivel: tema, ancho, punto de control (cp), bandera de meta y, desde el 1-2, arena del jefe final. */
function Builder(cols){
  const map=Array.from({length:ROWS},()=>Array(cols).fill('.'));
  const L={cols,map,nuts:[],enemies:[],lifts:[],spouts:[],pipes:[],spout(x){L.spouts.push(x)},
    pipe(x,h,o){for(let i=0;i<h;i++){L.set(x,11-i,'Q');L.set(x+1,11-i,'Q')}L.pipes.push(Object.assign({x,h},o||{}))},
    set(x,y,c){if(x>=0&&x<cols&&y>=0&&y<ROWS)map[y][x]=c},
    floor(a,b,c='#'){for(let x=a;x<=b;x++){map[12][x]=c;map[13][x]='#'}},
    gap(a,b){for(let x=a;x<=b;x++){map[12][x]='.';map[13][x]='.'}},
    row(a,b,y,c){for(let x=a;x<=b;x++)L.set(x,y,c)},
    col(x,y0,y1,c){for(let y=y0;y<=y1;y++)L.set(x,y,c)},
    drum(x,h){for(let i=0;i<h;i++)L.set(x,11-i,'D')},
    up(x,h){for(let i=0;i<h;i++)for(let j=0;j<=i;j++)L.set(x+i,11-j,'S')},
    down(x,h){for(let i=0;i<h;i++)for(let j=0;j<=i;j++)L.set(x+h-1-i,11-j,'S')},
    ceil(a,b,y1=1){for(let x=a;x<=b;x++)for(let y=0;y<=y1;y++)map[y][x]='R'},
    nut(a,b,y){for(let x=a;x<=b;x++)L.nuts.push({x:x*T+3,y:y*T+2,got:false})},
    en(type,...xs){xs.forEach(x=>L.enemies.push({x:x*T,y:(type==='fly'?6:10)*T,type}))},
    fly(x,row){L.enemies.push({x:x*T,y:row*T,type:'fly'})},
    lift(x0,range,y,w=3,axis='x'){L.lifts.push({x0:x0*T,y0:y*T,range:range*T,w:w*T,h:8,axis,x:x0*T,y:y*T,dx:0,dy:0,ph:Math.random()*6})}};
  return L}

function makeBoss(def){const look=def.look||def.type;const sz={tire:[44,44],scorp:[58,30],motor:[48,44],snowman:[44,54],crab:[64,34],golem:[50,56],octo:[52,48]}[look];

function solidT(c,r){if(r<0)return false;if(c<0||c>=COLS)return true;if(r>=ROWS)return false;return SOLID.has(map[r][c])}
function moveX(e){e.x+=e.vx;const y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);
  const c=e.vx>0?Math.floor((e.x+e.w-.01)/T):Math.floor(e.x/T);
  for(let r=y0;r<=y1;r++)if(solidT(c,r)){e.x=e.vx>0?c*T-e.w:(c+1)*T;return true}return false}
function moveY(e){e.y+=e.vy;e.onGround=false;const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T);
  const r=e.vy>0?Math.floor((e.y+e.h-.01)/T):Math.floor(e.y/T);let hit=null,best=1e9;
  for(let c=x0;c<=x1;c++)if(solidT(c,r)){const dd=Math.abs((c+.5)*T-(e.x+e.w/2));if(dd<best){best=dd;hit=c}}
  if(hit===null)return null;
  if(e.vy>0){e.y=r*T-e.h;e.onGround=true}else{e.y=(r+1)*T}
  const vy=e.vy;e.vy=0;return vy<0?{c:hit,r}:null}
function pushX(e,dx){const v=e.vx;e.vx=dx;moveX(e);e.vx=v}
function overlap(a,b,m=0){return a.x<b.x+b.w-m&&a.x+a.w>b.x+m&&a.y<b.y+b.h&&a.y+a.h>b.y+m}

function stepLifts(){liftT++;lifts.forEach(l=>{const o=(1-Math.cos(liftT*.018+l.ph))/2;
  if(l.axis==='y'){const ny=l.y0-o*l.range;l.dy=ny-l.y;l.y=ny;l.dx=0}else{const nx=l.x0+o*l.range;l.dx=nx-l.x;l.x=nx;l.dy=0}})}
function rideLifts(e,prevBottom){if(e.vy<0)return null;for(const l of lifts){
  if(e.x+e.w>l.x+1&&e.x<l.x+l.w-1&&prevBottom<=l.y+2-Math.min(0,l.dy)&&e.y+e.h>=l.y-1){e.y=l.y-e.h;e.vy=0;e.onGround=true;return l}}return null}

function fire(){if(shots.length>=(CH.shots||2)||fireCD>0)return;fireCD=CH.fireCD||14;P.throwT=12;
  const s={x:P.face>0?P.x+P.w-2:P.x-6,y:P.y+3,w:8,h:8,vx:(CH.shotSpd||3.4)*P.face+P.vx*.4,vy:1,life:100,onGround:false};

function killShot(s,spark){s.dead=true;level.remove(s.mesh);if(spark)burst(wx(s.x+4),wy(s.y+4),5)}
function stepShots(){const vwPx=visW*T;shots.forEach(s=>{if(s.dead)return;
  s.vy=Math.min(s.vy+.35*GRAV,6);if(moveX(s)){killShot(s,true);beep(160,.05,'triangle');return}
  moveY(s);if(s.onGround)s.vy=-3.3;

  setStyle(s){this.style=s||SONGS.meadow;if(delayFb)delayFb.gain.value=this.style.echo||.28},

  play(s,t,sp){const S=this.style,bar=Math.floor(s/16),b=s%16,r=S.bass[bar],ch=S.chords[bar];

    else if(b%4===1)tone(t,mf(ch[(b>>2)%3]+12),sp*.9,'sawtooth',.012,musGain,true);

  const can=(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&(el.requestFullscreen||el.webkitRequestFullscreen);

  if(kind==='levels'){state='levels';
    h=`<h2>ELIGE MUNDO</h2><div class="lv">${LEVELS.map((l,i)=>`<button type="button" id="lv${i}" ${i<save.unlocked?'':'disabled'}>${i<save.unlocked?'':'🔒 '}${l.id} ${l.name}<small>${l.boss?'JEFE: '+l.boss.name:'SIN JEFE'}</small></button>`).join('')}</div><div class="row">${B('back','VOLVER','alt')}</div>`}
  if(kind==='pause')h=`<h1>PAUSA</h1><p>Tuercas: ${nuts} · Puntos: ${score}</p><div class="row">${B('go','CONTINUAR')}${B('menu','MENÚ','alt')}</div><p class="small">P / Esc para continuar</p>`;
  if(kind==='over'){const atCp=checkpoint>=LV.cp;saveRecord();
    h=`<h1>FIN DEL TURNO</h1><p>Tuercas: ${nuts} · Puntos: ${score}</p><p class="small">${recText()}</p><div class="row">${B('go',atCp?'SEGUIR DESDE ⚑':'REINTENTAR '+LV.id)}${B('menu','MENÚ','alt')}</div><p class="small">No vuelves al principio: sigues en el mundo ${LV.id}${atCp?' desde el punto de control':''} con 3 vidas.</p>`}
  if(kind==='clear'){const n=LEVELS[lvIdx+1];
    h=`<h1>¡MUNDO ${LV.id} SUPERADO!</h1><p>Tuercas: ${nuts} · Puntos: ${score}</p><p class="small">Bonus de vidas: ${winBonus} · Tiempo sobrante ×10</p><div class="row">${B('go','SIGUIENTE: '+n.id+' ▶')}${B('menu','MENÚ','alt')}</div><p class="small">${n.name}${n.boss?' · JEFE: '+n.boss.name:''}</p>`}
  if(kind==='end'){const isRec=saveRecord();
    h=`<h1>¡HAS SALVADO EL TALLER!</h1><p>${CH.name} ha cruzado los ${LEVELS.length} mundos y derrotado a los ${LEVELS.filter(l=>l.boss).length} jefes.</p><p>Tuercas: ${nuts} · Puntos: ${score}</p><p class="small">${isRec?'¡NUEVO RÉCORD!':recText()}</p><div class="row">${B('go','MENÚ')}</div>`}
  card.innerHTML=h;ov.hidden=false;
  if(kind==='title'){on('go',()=>{goFull();initAudio();showSelect()});on('cont',continueGame)}
  if(kind==='levels'){LEVELS.forEach((l,i)=>on('lv'+i,()=>{startRun();startLevel(i,false)}));on('back',showSelect)}
  if(kind==='pause'){on('go',togglePause);on('menu',toMenu)}
  if(kind==='over')on('go',()=>{const atCp=checkpoint>=LV.cp;startRun();startLevel(lvIdx,atCp)}),on('menu',toMenu);
  if(kind==='clear'){on('go',()=>startLevel(lvIdx+1,false));on('menu',toMenu)}
  if(kind==='end')on('go',toMenu);
}
let charIdx=0;
function showSelect(){state='select';$('bossbar').hidden=true;Music.stop();
  P.x=3*T+2;P.y=groundSpawnY(3);P.vx=P.vy=0;P.inv=0;P.face=1;camX=0;
  ov.classList.add('sel');ov.hidden=false;$('pause').hidden=true;
  card.innerHTML=`<h2>ELIGE PERSONAJE</h2><div class="row">${B('prev','◀','arrow alt')}<div class="who"><b id="cname"></b><p id="cdesc" class="small"></p>
    <div class="stars"><span>VELOCIDAD</span><span id="sv"></span><span>SALTO</span><span id="sj"></span><span>TUERCAS</span><span id="st"></span></div></div>${B('next','▶','arrow alt')}</div>
    <div class="row">${B('go','ELEGIR ▶')}${B('back','VOLVER','alt')}</div>`;
  on('prev',()=>pickChar(-1));on('next',()=>pickChar(1));on('back',toMenu);
  on('go',()=>{save.char=charIdx;writeSave();if(save.unlocked>1)showOverlay('levels');else{startRun();startLevel(0,false)}});
  charIdx=CHARS.indexOf(CH);pickChar(0)}
function pickChar(d){charIdx=(charIdx+d+CHARS.length)%CHARS.length;CH=CHARS[charIdx];buildHero(CH);setHelmet(false);
  $('cname').textContent=CH.name;$('cdesc').textContent=CH.desc;const st=n=>'★'.repeat(n)+'☆'.repeat(5-n);$('sv').textContent=st(CH.vel);$('sj').textContent=st(CH.salto);$('st').textContent=st(CH.tir||3);
  updHud();if(d)beep(660+d*120,.06,'square',0,.04)}
function continueGame(){goFull();initAudio();CH=CHARS[save.char]||CHARS[0];charIdx=CHARS.indexOf(CH);buildHero(CH);startRun();startLevel(save.lvl,save.cp)}
function toMenu(){Music.stop();$('bossbar').hidden=true;keys.left=keys.right=keys.jump=keys.fire=keys.down=false;showOverlay('title')}
function togglePause(){
  if(state==='play'){state='pause';keys.left=keys.right=keys.jump=keys.fire=keys.down=false;document.querySelectorAll('.btn.on,#dpad i.on').forEach(b=>b.classList.remove('on'));Music.stop();showOverlay('pause')}
  else if(state==='pause'){state='play';ov.hidden=true;$('pause').hidden=false;accT=0;last=performance.now();try{ac&&ac.resume()}catch(_){}Music.start()}}
$('pause').onclick=togglePause;

/* ================= BUCLE ================= */
let last=performance.now(),accT=0;
function loop(now){accT+=Math.min(100,now-last);last=now;while(accT>=1000/60){step();accT-=1000/60}sync(now);if(composer)composer.render();else renderer.render(scene,camera);requestAnimationFrame(loop)}

CH=CHARS[save.char]||CHARS[0];charIdx=CHARS.indexOf(CH);buildHero(CH);
loadLevel(Math.min(save.lvl||0,LEVELS.length-1));checkpoint=2;P.x=3*T+2;P.y=groundSpawnY(3);setHelmet(false);
applyQuality();resize();updHud();showOverlay('title');requestAnimationFrame(loop);
</script>
<script>
try{if(window.NeiraApp)NeiraApp.setOrientation('landscape')}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
</script>
</body>
