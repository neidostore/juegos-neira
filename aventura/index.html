<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aventura Neira (boceto)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Arial Black',Impact,system-ui,sans-serif}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
#app.rot{width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
canvas{display:block}
.hud{position:absolute;z-index:3;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.6)}
#hearts{left:14px;top:10px;font-size:26px;letter-spacing:2px}
#hearts .f{color:#ff3a4a}#hearts .h{color:#ff3a4a;opacity:.55}#hearts .e{color:#000;opacity:.35}
#gems{left:16px;top:44px;font-size:16px}#gems b{color:#4aff8a}
#zone{right:14px;top:10px;font-size:14px;text-align:right;color:#ffe08a}#zone small{display:block;color:#fff;font-size:11px;font-family:system-ui,sans-serif;font-weight:600}
#menuB{right:14px;top:50px;font:700 11px system-ui;padding:6px 10px;border-radius:8px;border:0;background:rgba(0,0,0,.45);color:#fff;pointer-events:auto}
#msg{left:50%;top:18%;transform:translateX(-50%);font-size:18px;background:rgba(0,0,0,.4);padding:8px 16px;border-radius:12px;display:none;white-space:nowrap}
#joy{position:absolute;z-index:3;left:22px;bottom:22px;width:104px;height:104px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.18);touch-action:none}
#joy i{position:absolute;left:31px;top:31px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}
.btn{position:absolute;z-index:3;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;border:3px solid rgba(255,255,255,.7);text-shadow:0 1px 2px #000;touch-action:none;-webkit-tap-highlight-color:transparent}
.btn.on{filter:brightness(1.4)}
#bSword{right:24px;bottom:24px;width:86px;height:86px;background:rgba(220,60,40,.6)}
#bShield{right:122px;bottom:16px;width:62px;height:62px;background:rgba(60,120,230,.55)}
#bBomb{right:108px;bottom:96px;width:56px;height:56px;background:rgba(240,180,30,.55)}
#sel{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#sel h1{margin:10px 0 0;text-align:center;color:#ffd84a;font-size:24px;text-shadow:0 3px 0 #a0400a,0 4px 8px rgba(0,0,0,.6)}
#sel h1 small{display:block;font:700 12px system-ui;color:#fff;text-shadow:0 1px 3px #000}
#cards{display:flex;gap:8px;justify-content:center;padding:0 10px 12px;pointer-events:auto}
.card{flex:1;max-width:150px;background:rgba(10,14,28,.72);border:2px solid rgba(255,255,255,.35);border-radius:12px;padding:7px 8px;color:#fff;text-align:center}
.card b{display:block;font-size:15px;color:#ffd84a}.card span{display:block;font:600 10px system-ui;opacity:.9;margin-top:3px;line-height:1.25}
.card.pick{border-color:#ffd84a;background:rgba(160,90,10,.75)}
#go{position:absolute;z-index:6;left:50%;bottom:110px;transform:translateX(-50%);display:none;padding:10px 26px;border-radius:12px;border:0;background:#ffb627;color:#3a1a00;font:900 18px 'Arial Black',system-ui;box-shadow:0 4px 0 #a05a00;pointer-events:auto}
body.sel .hud,body.sel #joy,body.sel .btn{display:none}
#err{position:absolute;z-index:9;left:8px;bottom:8px;color:#f88;font:12px monospace;display:none;max-width:90%}
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hearts"></div>
  <div class="hud" id="gems"><b>◆</b> <span id="gemN">0</span> &nbsp; 🗝 <span id="keyN">0</span></div>
  <div class="hud" id="zone">BOSQUE DE NEIRA<small>Boceto: rompe gelatinas, abre cofres y busca la llave</small></div>
  <button class="hud" id="menuB" onclick="location.href='../'">Menú de juegos</button>
  <div class="hud" id="msg"></div>
  <div id="joy"><i></i></div>
  <div class="btn" id="bSword">ESPADA</div><div class="btn" id="bShield">ESCUDO</div><div class="btn" id="bBomb">BOMBA</div>
  <div id="sel"><h1>¿QUIÉN VA A LA AVENTURA?<small>Toca un personaje</small></h1><div id="cards"></div></div>
  <button id="go">¡A LA AVENTURA!</button>
  <div id="err"></div>
</div>
<script src="js/three.min.js"></script>
<script src="js/CopyShader.js"></script><script src="js/LuminosityHighPassShader.js"></script>
<script src="js/EffectComposer.js"></script><script src="js/RenderPass.js"></script><script src="js/ShaderPass.js"></script><script src="js/UnrealBloomPass.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
document.body.classList.add('sel');const IN_APP=!!window.NeiraApp;try{if(IN_APP)NeiraApp.setOrientation('landscape')}catch(e){}
const MOBILE=/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
let ROT=false;const app=$('app');
window.onerror=(m)=>{const e=$('err');e.style.display='block';e.textContent=m};

/* ================= render ================= */
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
ren.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.4:2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.NoToneMapping;app.prepend(ren.domElement);
const sc=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,1,.1,220);
const hemi=new THREE.HemisphereLight(0xe6f4ff,0x3a6a1a,.12);sc.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,2.0);sun.castShadow=true;sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;sc.add(sun);sc.add(sun.target);
const rim=new THREE.DirectionalLight(0xffd8a0,.55);sc.add(rim);

/* cielo degradado */
(()=>{const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#2a7ae8');gr.addColorStop(.5,'#7cc4ff');gr.addColorStop(.75,'#cdeeff');gr.addColorStop(1,'#fff4dc');g.fillStyle=gr;g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;sc.background=t})();
sc.fog=new THREE.Fog(0xbfe4ff,34,90);
/* reflejos del cielo para metales y brillos */
(()=>{const es=new THREE.Scene();const sk=new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({map:sc.background,side:THREE.BackSide}));es.add(sk);
  const gr=new THREE.Mesh(new THREE.SphereGeometry(9.8,32,16,0,Math.PI*2,Math.PI*.55,Math.PI*.45),new THREE.MeshBasicMaterial({color:0x2a5a1a,side:THREE.BackSide}));es.add(gr);
  const sunB=new THREE.Mesh(new THREE.SphereGeometry(1.2,16,12),new THREE.MeshBasicMaterial({color:0xfff2d0}));sunB.position.set(-5,6,4);es.add(sunB);
  const pm=new THREE.PMREMGenerator(ren);sc.environment=pm.fromScene(es,.04).texture})();

/* postproceso: brillo + color tipo Super Neira Bro + desenfoque arriba/abajo (efecto maqueta) */
const FinalShader={uniforms:{tDiffuse:{value:null},res:{value:new THREE.Vector2(1,1)},tilt:{value:1}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 res;uniform float tilt;varying vec2 vUv;
  vec3 aces(vec3 x){const float a=2.51,b=.03,c=2.43,d=.59,e=.14;return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.,1.);}
  vec3 toS(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
  void main(){float b=tilt*smoothstep(.22,.5,abs(vUv.y-.5))*1.8;vec3 c=texture2D(tDiffuse,vUv).rgb;
    if(b>.05){vec2 px=b/res;c=c*.2;
      c+=.1*(texture2D(tDiffuse,vUv+vec2(px.x,0.)).rgb+texture2D(tDiffuse,vUv-vec2(px.x,0.)).rgb+texture2D(tDiffuse,vUv+vec2(0.,px.y)).rgb+texture2D(tDiffuse,vUv-vec2(0.,px.y)).rgb);
      c+=.1*(texture2D(tDiffuse,vUv+px*.7).rgb+texture2D(tDiffuse,vUv-px*.7).rgb+texture2D(tDiffuse,vUv+vec2(px.x,-px.y)*.7).rgb+texture2D(tDiffuse,vUv+vec2(-px.x,px.y)*.7).rgb);}
    c=aces(c*vec3(1.04,1.,.95)*.7);c=toS(c);float l=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(l),c,1.22);
    float d=distance(vUv,vec2(.5));c*=1.-.3*smoothstep(.42,.95,d);gl_FragColor=vec4(clamp(c,0.,1.),1.);}`};
let composer,finalPass,bloom;
function setupPost(){const gl=ren.getContext();let rt;const w=ren.domElement.width,h=ren.domElement.height;
  if(ren.capabilities.isWebGL2&&gl.getExtension('EXT_color_buffer_float'))rt=new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,format:THREE.RGBAFormat});
  composer=new THREE.EffectComposer(ren,rt);composer.addPass(new THREE.RenderPass(sc,cam));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(w,h),.22,.4,1.6);composer.addPass(bloom);
  finalPass=new THREE.ShaderPass(FinalShader);composer.addPass(finalPass)}
function resize(){ROT=innerHeight>innerWidth&&!IN_APP;app.classList.toggle('rot',ROT);
  const w=ROT?innerHeight:innerWidth,h=ROT?innerWidth:innerHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
  if(!composer)setupPost();composer.setSize(w,h);finalPass.uniforms.res.value.set(ren.domElement.width,ren.domElement.height)}
addEventListener('resize',()=>setTimeout(resize,60));

/* ================= texturas ================= */
function cv(w,h,f,rep){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rep)t.repeat.set(rep,rep);return t}
const T_grass=cv(512,512,(g,w,h)=>{g.fillStyle='#4fb836';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){const r=g.createRadialGradient(0,0,0,0,0,80);const x=R(0,w),y=R(0,h);g.save();g.translate(x,y);r.addColorStop(0,`hsla(${R(85,115)},60%,${R(30,50)}%,.35)`);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(-80,-80,160,160);g.restore()}
  for(let i=0;i<9000;i++){g.fillStyle=`hsl(${R(85,118)},${R(50,72)}%,${R(30,52)}%)`;g.fillRect(R(0,w),R(0,h),1.5,R(2,6))}},14);
const T_path=cv(512,512,(g,w,h)=>{g.fillStyle='#c9a46a';g.fillRect(0,0,w,h);for(let i=0;i<6000;i++){g.fillStyle=`hsl(${R(28,40)},${R(30,50)}%,${R(48,70)}%)`;g.fillRect(R(0,w),R(0,h),2,2)}
  for(let i=0;i<90;i++){g.fillStyle=`hsl(${R(25,35)},${R(5,15)}%,${R(55,75)}%)`;g.beginPath();g.ellipse(R(0,w),R(0,h),R(5,13),R(4,9),R(0,3),0,7);g.fill();g.fillStyle='rgba(0,0,0,.15)';g.fill()}});
T_path.repeat.set(1,8);
const T_pathA=(()=>{const c=document.createElement('canvas');c.width=64;c.height=4;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,64,0);gr.addColorStop(0,'#000');gr.addColorStop(.2,'#fff');gr.addColorStop(.8,'#fff');gr.addColorStop(1,'#000');g.fillStyle=gr;g.fillRect(0,0,64,4);return new THREE.CanvasTexture(c)})();
const T_wave=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='rgb(128,128,255)';g.fillRect(0,0,256,256);
  for(let i=0;i<160;i++){const x=R(0,256),y=R(0,256),r=R(8,26);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgb(${R(100,160)},${R(100,160)},255)`);gr.addColorStop(1,'rgba(128,128,255,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,10);return t})();
const T_foam=cv(256,64,(g,w,h)=>{g.clearRect(0,0,w,h);for(let i=0;i<220;i++){g.fillStyle=`rgba(255,255,255,${R(.3,.9)})`;g.beginPath();g.arc(R(0,w),R(0,h*.5)+h*.25,R(1,4),0,7);g.fill()}});
const T_roof=cv(256,256,(g,w,h)=>{g.fillStyle='#b8341e';g.fillRect(0,0,w,h);for(let r=0;r<10;r++)for(let c=0;c<9;c++){const x=c*30+(r%2?15:0),y=r*26;g.fillStyle=`hsl(${R(6,14)},${R(60,72)}%,${R(36,48)}%)`;g.beginPath();g.ellipse(x+14,y+16,14,13,0,0,Math.PI);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x,y+14,28,2)}});
const T_wall=cv(256,256,(g,w,h)=>{g.fillStyle='#efe2c4';g.fillRect(0,0,w,h);for(let i=0;i<3000;i++){g.fillStyle=`rgba(${R(150,200)},${R(130,170)},${R(100,140)},.15)`;g.fillRect(R(0,w),R(0,h),3,3)}
  g.strokeStyle='#7a4a24';g.lineWidth=14;g.strokeRect(0,0,w,h);g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke()});
const T_wood=cv(128,128,(g,w,h)=>{g.fillStyle='#9a6234';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.strokeStyle=`rgba(60,30,10,${R(.15,.4)})`;g.lineWidth=R(1,3);g.beginPath();const y=R(0,h);g.moveTo(0,y);g.bezierCurveTo(w*.3,y+R(-6,6),w*.6,y+R(-6,6),w,y+R(-4,4));g.stroke()}});
const T_dot=cv(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.4,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
const T_shadow=cv(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(0,0,0,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});

/* ================= utilidades ================= */
const S=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o||{}));
const P=(c,o)=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:.32,clearcoat:1,clearcoatRoughness:.12},o||{}));
function mk(geo,mat,x=0,y=0,z=0,parent=sc,cast=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
function bumpy(geo,amt){const p=geo.attributes.position,v=new THREE.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=1+(Math.sin(v.x*5.1+v.y*3.3)*.5+Math.sin(v.z*4.7-v.y*2.1)*.5)*amt;p.setXYZ(i,v.x*n,v.y*n,v.z*n)}geo.computeVertexNormals();return geo}
function shade(geo,top,bottom){const p=geo.attributes.position,c=new Float32Array(p.count*3),a=new THREE.Color(top),b=new THREE.Color(bottom),t=new THREE.Color();geo.computeBoundingBox();const bb=geo.boundingBox;
  for(let i=0;i<p.count;i++){const k=(p.getY(i)-bb.min.y)/(bb.max.y-bb.min.y||1);t.copy(b).lerp(a,k);c[i*3]=t.r;c[i*3+1]=t.g;c[i*3+2]=t.b}geo.setAttribute('color',new THREE.BufferAttribute(c,3));return geo}
const colliders=[];function addCol(x,z,r){colliders.push({x,z,r})}
const anim=[];let TIME=0;

/* ================= mundo ================= */
const ground=mk(new THREE.PlaneGeometry(90,90),S(0xffffff,{map:T_grass,roughness:.95}),0,0,0,sc,false);ground.rotation.x=-Math.PI/2;
// camino
const pathM=S(0xffffff,{map:T_path,roughness:.95,alphaMap:T_pathA,transparent:true,depthWrite:false});
const path=mk(new THREE.PlaneGeometry(4.4,46),pathM,2,.012,-2,sc,false);path.rotation.x=-Math.PI/2;path.rotation.z=.22;
const path2=mk(new THREE.PlaneGeometry(3.6,18),pathM,-4,.013,6.5,sc,false);path2.rotation.x=-Math.PI/2;path2.rotation.z=Math.PI/2+.1;
// río
const RIVER_X=-14;
const waterM=new THREE.MeshPhysicalMaterial({color:0x1a8ae8,roughness:.06,metalness:.1,clearcoat:1,normalMap:T_wave,normalScale:new THREE.Vector2(.6,.6),transparent:true,opacity:.9,emissive:0x0a3a8a,emissiveIntensity:.25});
const river=mk(new THREE.PlaneGeometry(6,90),waterM,RIVER_X,.06,0,sc,false);river.rotation.x=-Math.PI/2;
const bedM=S(0x2a5a7a,{roughness:1});const bed=mk(new THREE.PlaneGeometry(6.4,90),bedM,RIVER_X,.02,0,sc,false);bed.rotation.x=-Math.PI/2;
const foamM=new THREE.MeshBasicMaterial({map:T_foam,transparent:true,depthWrite:false,opacity:.8});
[-1,1].forEach(sd=>{const f=mk(new THREE.PlaneGeometry(.7,90),foamM,RIVER_X+sd*2.85,.08,0,sc,false);f.rotation.x=-Math.PI/2;f.rotation.z=Math.PI/2*0;T_foam.repeat.set(1,30)});
anim.push(dt=>{T_wave.offset.y-=dt*.18;T_wave.offset.x+=dt*.02;T_foam.offset.y-=dt*.1});
// piedras del río
const rockM=S(0x9a9aa6,{roughness:.85,flatShading:true}),mossM=S(0x4f9a34,{roughness:.9,flatShading:true});
function rock(x,z,s,moss){const g=new THREE.Group();const r=mk(bumpy(new THREE.DodecahedronGeometry(s,1),.12),rockM,0,s*.55,0,g);r.scale.y=.75;
  if(moss){const m=mk(bumpy(new THREE.SphereGeometry(s*.82,12,6,0,Math.PI*2,0,Math.PI*.35),.1),mossM,0,s*.62,0,g);m.scale.y=.75}g.position.set(x,0,z);g.rotation.y=R(0,6);sc.add(g);addCol(x,z,s*.9);return g}
for(let i=0;i<26;i++){const sd=i%2?1:-1;rock(RIVER_X+sd*R(3.2,4.2),-30+i*2.4+R(-.6,.6),R(.35,.8),Math.random()<.5)}
// puente
const bridge=new THREE.Group();const woodM=S(0xffffff,{map:T_wood,roughness:.75});
for(let i=0;i<9;i++)mk(new THREE.BoxGeometry(9,.18,.62),woodM,0,.42,-2.6+i*.66,bridge);
[-1,1].forEach(sd=>{mk(new THREE.BoxGeometry(9,.12,.12),woodM,0,1.25,sd*3,bridge);for(let i=0;i<5;i++)mk(new THREE.BoxGeometry(.14,1,.14),woodM,-4+i*2,.85,sd*3,bridge)});
bridge.position.set(RIVER_X,0,6.4);sc.add(bridge);
// árboles
const leafCols=[[0x5ad04a,0x1f7a2a],[0x6ade4a,0x2a8a2a],[0x4ac03a,0x17662a],[0x8ad84a,0x3a8a1a]];
const trunkM=S(0x8a5a2e,{roughness:.9});
function tree(x,z,s){const t=new THREE.Group();const tr=mk(bumpy(new THREE.CylinderGeometry(.22*s,.38*s,2*s,10,4),.06),trunkM,0,s,0,t);
  const [top,bot]=leafCols[Math.floor(R(0,leafCols.length))];const lm=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.65});
  [[0,2.5,0,1.35],[.85,2.1,.35,1],[-.75,2.15,-.2,1.05],[.1,3.3,.1,.95],[-.35,2.7,.75,.85],[.5,2.8,-.6,.8]].forEach(([a,b,c,r])=>{const g=shade(bumpy(new THREE.SphereGeometry(r*s,22,16),.08),top,bot);mk(g,lm,a*s,b*s,c*s,t)});
  t.position.set(x,0,z);t.rotation.y=R(0,6);sc.add(t);addCol(x,z,.55*s);return t}
[[-6,-8,1.2],[-4,-13,1.1],[7,-9,1.3],[11,-4,1.1],[10,4,1.25],[-21,-8,1.35],[-22,4,1.2],[13,9,1.05],[-7,13,1.15],[6,14,1.3],[16,-12,1.25],[-9,-18,1.4],[3,-19,1.3],[17,1,1.2],[-2,-24,1.3],[12,-20,1.2],[18,16,1.3],[-20,16,1.25],[-24,-20,1.3],[20,-24,1.2],[8,22,1.3],[-4,22,1.2]].forEach(a=>tree(...a));
// arbustos

function joyUpd(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(ROT){const t=dx;dx=dy;dy=-t}
  const L=Math.hypot(dx,dy),m=46;if(L>m){dx*=m/L;dy*=m/L}joyX=dx/m;joyY=dy/m;knob.style.transform=`translate(${ROT?-dy:dx}px,${ROT?dx:dy}px)`}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);joyUpd(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyUpd(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,e=>{if(e.pointerId!==joyId)return;joyId=null;joyX=joyY=0;knob.style.transform=''}));

const SFX={ac:null,init(){if(this.ac)return;try{this.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  tone(f,d,type='square',v=.06,f2){const a=this.ac;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);
    g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)},
  swish(){this.tone(900,.12,'sawtooth',.03,200)},hit(){this.tone(220,.12,'square',.07,90)},gem(){this.tone(1320,.08,'square',.04);setTimeout(()=>this.tone(1760,.1,'square',.04),70)},
  hurt(){this.tone(300,.25,'sawtooth',.07,80)},boom(){this.tone(120,.5,'sawtooth',.12,30)},chest(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.16,'triangle',.07),i*110))}};

/* ================= lógica ================= */
function say(t,ms){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>m.style.display='none',ms||1800)}
function hud(){let h='';for(let i=0;i<H.max;i+=2){const v=H.hp-i;h+=`<span class="${v>=2?'f':v===1?'h':'e'}">♥</span>`}$('hearts').innerHTML=h;$('gemN').textContent=H.gems;$('keyN').textContent=H.keys}
function burst(x,y,z,col,n,sp){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(R(.05,.12),6,4),new THREE.MeshBasicMaterial({color:col,transparent:true}));m.position.set(x,y,z);sc.add(m);
  parts.push({m,vx:R(-1,1)*sp,vy:R(.5,1.6)*sp,vz:R(-1,1)*sp,life:R(.5,.9)})}}
function dropGem(x,z,n){for(let i=0;i<n;i++){const c=[0x4aff7a,0x4ab0ff,0xff4a8a][Math.floor(R(0,3))];const m=new THREE.Mesh(new THREE.OctahedronGeometry(.2,0),P(c,{emissive:c,emissiveIntensity:.6}));m.scale.y=1.5;m.castShadow=true;
  m.position.set(x,.5,z);sc.add(m);gems.push({m,x,z,vx:R(-2,2),vz:R(-2,2),vy:R(3,5),y:.5,t:0})}}
function collide(o,r){for(const c of colliders){if(c.dead)continue;if(c.box){const [x0,x1,z0,z1]=c.box;const cx=clamp(o.x,x0,x1),cz=clamp(o.z,z0,z1),dx=o.x-cx,dz=o.z-cz,d=Math.hypot(dx,dz);
      if(d<r){if(d<1e-4){o.z=z1+r}else{o.x=cx+dx/d*r;o.z=cz+dz/d*r}}continue}
    const dx=o.x-c.x,dz=o.z-c.z,d=Math.hypot(dx,dz),m=r+c.r;if(d<m&&d>1e-4){o.x=c.x+dx/d*m;o.z=c.z+dz/d*m}}
  // río (solo se cruza por el puente)
  if(Math.abs(o.x-RIVER_X)<3.3&&Math.abs(o.z-6.4)>2.4){o.x=o.x<RIVER_X?RIVER_X-3.3:RIVER_X+3.3}
  o.x=clamp(o.x,-27,27);o.z=clamp(o.z,-27,27)}
function swing(){if(H.swingCd>0)return;H.swing=.28;H.swingCd=.38;SFX.swish();const fx=Math.sin(H.face),fz=Math.cos(H.face);const reach=(HC.weapon==='wrench'?2.1:1.8)*HC.h,dmg=HC.weapon==='wrench'?2:1;
  if(HC.weapon==='ball'||HC.weapon==='bow'){shoot(fx,fz);return}
  for(const s of slimes){if(s.dead)continue;const dx=s.x-H.x,dz=s.z-H.z,d=Math.hypot(dx,dz);if(d<reach&&(dx*fx+dz*fz)/Math.max(d,.01)>-.2)hitSlime(s,dx/d,dz/d,dmg)}
  for(const c of chests){if(c.open)continue;if(Math.hypot(c.x-H.x,c.z-H.z)<reach+.4)openChest(c)}}
const shots=[];function shoot(fx,fz){const isBall=HC.weapon==='ball';const m=isBall?new THREE.Mesh(new THREE.SphereGeometry(.2,14,10),S(0xffffff,{roughness:.4})):new THREE.Mesh(new THREE.OctahedronGeometry(.16,0),P(0xff4ad8,{emissive:0xff2ad8,emissiveIntensity:1.5}));
  m.castShadow=true;m.position.set(H.x+fx*.6,.7,H.z+fz*.6);sc.add(m);shots.push({m,x:m.position.x,z:m.position.z,vx:fx*(isBall?10:14),vz:fz*(isBall?10:14),life:isBall?1.6:1,bounce:isBall?3:0,y:.7,vy:isBall?2:0})}
function hitSlime(s,nx,nz,dmg){s.hp-=dmg;s.hitT=.25;s.vx=nx*9;s.vz=nz*9;SFX.hit();burst(s.x,.6,s.z,s.col,8,2);
  if(s.hp<=0){s.dead=true;sc.remove(s.g);burst(s.x,.5,s.z,s.col,22,3);dropGem(s.x,s.z,2);setTimeout(()=>{if(!H.started)return;s.dead=false;s.hp=2;s.x=s.home[0];s.z=s.home[1];sc.add(s.g)},12000)}}
function openChest(c){c.open=true;SFX.chest();c.glow.material.opacity=.9;if(c.gift==='key'){H.keys++;say('¡Has encontrado la LLAVE DEL TALLER! 🗝',2600);burst(c.x,1.2,c.z,0xffd84a,30,2.5)}else{say('¡Cofre! +10 diamantes',1800);dropGem(c.x,c.z,10)}hud()}
function placeBomb(){if(H.bombCd>0)return;H.bombCd=1.2;const g=new THREE.Group();mk(new THREE.SphereGeometry(.32,18,14),P(0x1a1a28,{roughness:.2}),0,.32,0,g);mk(new THREE.CylinderGeometry(.04,.04,.2,6),S(0xd8c8a0),0,.7,0,g);
  const sp=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:0xffd84a}));sp.position.y=.82;g.add(sp);const fx=Math.sin(H.face),fz=Math.cos(H.face);g.position.set(H.x+fx*.9,0,H.z+fz*.9);sc.add(g);
  bombs.push({g,sp,x:g.position.x,z:g.position.z,t:1.6})}
function explode(b){sc.remove(b.g);SFX.boom();burst(b.x,.6,b.z,0xffa020,30,4);burst(b.x,.6,b.z,0x555555,20,2.5);const fl=new THREE.PointLight(0xffa040,4,9);fl.position.set(b.x,1.5,b.z);sc.add(fl);setTimeout(()=>sc.remove(fl),180);
  shake=.4;for(const s of slimes){if(!s.dead&&Math.hypot(s.x-b.x,s.z-b.z)<2.8){const d=Math.max(.1,Math.hypot(s.x-b.x,s.z-b.z));hitSlime(s,(s.x-b.x)/d,(s.z-b.z)/d,2)}}
  for(const c of cracked){if(!c.dead&&Math.hypot(c.col.x-b.x,c.col.z-b.z)<3){c.dead=true;c.col.dead=true;sc.remove(c.m);burst(c.col.x,1,c.col.z,0x8a8a96,30,3);say('¡La roca se ha roto! Hay algo dentro...',2200)}}
  if(Math.hypot(H.x-b.x,H.z-b.z)<2.2)hurt(1,(H.x-b.x),(H.z-b.z))}
let shake=0;
function hurt(n,dx,dz){if(H.inv>0)return;if(H.shield){SFX.tone(700,.08,'square',.05);return}H.hp=Math.max(0,H.hp-n);H.inv=1.1;const d=Math.max(.1,Math.hypot(dx,dz));H.vx=dx/d*8;H.vz=dz/d*8;SFX.hurt();shake=.25;hud();
  if(H.hp<=0){say('¡Ay! Vuelves a la casa con todos los corazones',2200);H.hp=H.max;H.x=1;H.z=-6;hud()}}

/* ================= bucle ================= */
const tmp=new THREE.Vector3();let last=performance.now();
function step(dt){TIME+=dt;anim.forEach(f=>f(dt));
  // fila de personajes (elegir)
  if(!H.started){lineup.forEach((m,i)=>{const u=m.userData;u.body.position.y=u.jump?Math.abs(Math.sin(TIME*6))*.35:0;m.rotation.y=Math.sin(TIME*.8+i)*.25;u.arms[1].rotation.x=-.3+Math.sin(TIME*2+i)*.15});
    cam.position.set(0,3.1,.6);cam.lookAt(0,1.25,-5.6);return}
  const u=hero.userData;
  // movimiento
  let mx=joyX,mz=joyY;if(keys.arrowleft||keys.a)mx=-1;if(keys.arrowright||keys.d)mx=1;if(keys.arrowup||keys.w)mz=-1;if(keys.arrowdown||keys.s)mz=1;
  const ml=Math.min(1,Math.hypot(mx,mz));H.shield=!!keys.shield;const spd=HC.spd*(H.shield?.45:1)*(H.swing>0?.5:1);
  if(ml>.12){H.face=Math.atan2(mx,mz);H.x+=mx/Math.max(ml,1)*spd*dt;H.z+=mz/Math.max(ml,1)*spd*dt}
  H.x+=H.vx*dt;H.z+=H.vz*dt;H.vx*=Math.pow(.002,dt);H.vz*=Math.pow(.002,dt);collide(H,.45);
  if(keys.sword){swing();keys.sword=false;$('bSword').classList.remove('on')}if(keys.bomb){placeBomb();keys.bomb=false;$('bBomb').classList.remove('on')}
  H.swing=Math.max(0,H.swing-dt);H.swingCd=Math.max(0,H.swingCd-dt);H.inv=Math.max(0,H.inv-dt);H.bombCd=Math.max(0,H.bombCd-dt);
  // animación del héroe
  hero.position.set(H.x,0,H.z);let dr=H.face-hero.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));hero.rotation.y+=dr*Math.min(1,dt*14);
  const walk=ml>.12?TIME*11:0,amp=ml>.12?.55:0;u.legs[0].rotation.x=Math.sin(walk)*amp;u.legs[1].rotation.x=-Math.sin(walk)*amp;u.body.position.y=ml>.12?Math.abs(Math.sin(walk))*.06:Math.sin(TIME*2)*.015;
  u.arms[0].rotation.x=H.shield?-1.35:-Math.sin(walk)*amp*.6;u.arms[0].rotation.z=H.shield?.5:0;
  if(H.swing>0){const k=1-H.swing/.28;u.arms[1].rotation.x=-1.9+k*.4;u.arms[1].rotation.z=-1.6+k*3.0;u.weapon.rotation.x=.8}else{u.arms[1].rotation.x=Math.sin(walk)*amp*.6-.15;u.arms[1].rotation.z=0;u.weapon.rotation.x=.25}
  hero.visible=H.inv<=0||Math.floor(H.inv*14)%2===0;
  // gelatinas
  for(const s of slimes){if(s.dead)continue;s.t+=dt;const dx=H.x-s.x,dz=H.z-s.z,d=Math.hypot(dx,dz);
    if(s.hitT>0){s.hitT-=dt}else if(d<9){s.vx+=(dx/d*1.6-s.vx)*dt*2;s.vz+=(dz/d*1.6-s.vz)*dt*2}else{s.vx*=.95;s.vz*=.95}
    s.x+=s.vx*dt;s.z+=s.vz*dt;if(s.hitT>0){s.vx*=Math.pow(.01,dt);s.vz*=Math.pow(.01,dt)}collide(s,.5);
    const hop=Math.abs(Math.sin(s.t*5));s.g.position.set(s.x,hop*.25,s.z);s.b.scale.set(1+(1-hop)*.15,.78-(1-hop)*.12,1+(1-hop)*.15);s.g.rotation.y=Math.atan2(dx,dz);
    s.b.material.emissiveIntensity=s.hitT>0?1.2:.22;if(d<.95&&s.hitT<=0)hurt(1,-dx,-dz)}
  // disparos
  for(let i=shots.length-1;i>=0;i--){const sh=shots[i];sh.life-=dt;sh.x+=sh.vx*dt;sh.z+=sh.vz*dt;if(sh.bounce){sh.vy-=14*dt;sh.y+=sh.vy*dt;if(sh.y<.2){sh.y=.2;sh.vy=Math.abs(sh.vy)*.7}}
    const o={x:sh.x,z:sh.z};collide(o,.2);if(o.x!==sh.x||o.z!==sh.z){if(sh.bounce>0){sh.bounce--;sh.vx*=-1;sh.vz*=-1;sh.x=o.x;sh.z=o.z}else sh.life=0}
    sh.m.position.set(sh.x,sh.y,sh.z);sh.m.rotation.x+=dt*10;
    for(const s of slimes){if(!s.dead&&Math.hypot(s.x-sh.x,s.z-sh.z)<.75){const d=Math.max(.1,Math.hypot(sh.vx,sh.vz));hitSlime(s,sh.vx/d,sh.vz/d,1);if(sh.bounce>0){sh.bounce--;sh.vx*=-.8;sh.vz*=-.8}else sh.life=0;break}}
    for(const c of chests){if(!c.open&&Math.hypot(c.x-sh.x,c.z-sh.z)<.9){openChest(c);sh.life=0}}
    if(sh.life<=0){sc.remove(sh.m);shots.splice(i,1)}}
  // bombas
  for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.t-=dt;b.sp.visible=Math.floor(b.t*(b.t<.6?16:6))%2===0;b.g.scale.setScalar(1+(b.t<.5?(.5-b.t)*.5:0));if(b.t<=0){explode(b);bombs.splice(i,1)}}
  // diamantes
  for(let i=gems.length-1;i>=0;i--){const g=gems[i];g.t+=dt;if(g.vy||g.y>.5){g.vy-=12*dt;g.y+=g.vy*dt;g.x+=g.vx*dt;g.z+=g.vz*dt;if(g.y<.5){g.y=.5;g.vy=0;g.vx=g.vz=0}}
    g.m.position.set(g.x,g.y+Math.sin(TIME*3+i)*.08,g.z);g.m.rotation.y+=dt*3;
    if(g.t>.4&&Math.hypot(g.x-H.x,g.z-H.z)<.9){sc.remove(g.m);gems.splice(i,1);H.gems++;SFX.gem();hud()}}
  // cofres abiertos
  for(const c of chests)if(c.open){c.lidG.rotation.x=Math.max(-1.9,c.lidG.rotation.x-dt*5);c.glow.material.opacity=Math.max(0,c.glow.material.opacity-dt*.5)}
  // partículas
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=6*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.05,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;p.m.material.opacity=Math.min(1,p.life*2);if(p.life<=0){sc.remove(p.m);parts.splice(i,1)}}
  // cámara
  shake=Math.max(0,shake-dt);tmp.set(H.x,7.2,H.z+6.8);cam.position.lerp(tmp,1-Math.exp(-6*dt));if(shake>0){cam.position.x+=R(-1,1)*shake*.4;cam.position.y+=R(-1,1)*shake*.4}
  cam.lookAt(cam.position.x,.4,cam.position.z-6.8+.3);
  sun.position.set(H.x-9,18,H.z+8);sun.target.position.set(H.x,0,H.z);rim.position.set(H.x+8,6,H.z-10)}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;try{step(dt);composer.render()}catch(e){$('err').style.display='block';$('err').textContent=e.message}}
resize();hud();
sun.position.set(-9,18,3);sun.target.position.set(0,0,-5);
requestAnimationFrame(frame);
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
</script>
</body>
