<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a10">
<title>Aventura Neira · La llave del taller</title>
<link rel="stylesheet" href="game/style.css">
</head>
<body class="title">
<div id="app">
  <!-- HUD -->
  <div class="hud" id="hearts"></div>
  <div class="hud" id="counts"><span class="gem">◆</span> <b id="gemN">0</b><span class="sep"></span><span class="key">🗝</span> <b id="keyN">0</b>/6</div>
  <canvas class="hud" id="mini" width="120" height="150"></canvas>
  <button class="hud" id="pauseB" aria-label="Pausa">❚❚</button>
  <div class="hud" id="bossbar"><b id="bossName"></b><div class="bar"><i id="bossHp"></i></div></div>
  <div class="hud" id="banner"><small id="bannerS"></small><b id="bannerT"></b></div>
  <div class="hud" id="msg"></div>
  <div class="hud" id="talk"><b id="talkWho"></b><span id="talkTxt"></span><i>▼</i></div>
  <!-- controles -->
  <div id="joy"><i></i></div>
  <div class="btn" id="bSword"><span>ESPADA</span></div>
  <div class="btn" id="bShield"><span>ESCUDO</span></div>
  <div class="btn" id="bBomb"><span>BOMBA</span></div>
  <!-- portada -->
  <div class="screen" id="titleS">
    <div class="logo"><small>LA LLAVE DEL TALLER</small>AVENTURA<br>NEIRA</div>
    <div class="menu"><button id="contB" class="big">CONTINUAR</button><button id="newB" class="big">NUEVA PARTIDA</button></div>
    <p class="hint">Joystick para andar · ESPADA para atacar · ESCUDO para protegerte · BOMBA para romper rocas agrietadas</p>
  </div>
  <!-- elegir personaje -->
  <div class="screen" id="selS"><h1>¿QUIÉN VA A LA AVENTURA?<small>Toca un personaje</small></h1><div id="cards"></div><button id="goB" class="big">¡A LA AVENTURA!</button></div>
  <!-- pausa -->
  <div class="screen" id="pauseS"><div class="panel"><h2>PAUSA</h2>
    <div class="stats" id="pStats"></div>
    <button id="resB" class="big">SEGUIR</button><button id="charB">CAMBIAR PERSONAJE</button><button id="musB">MÚSICA: SÍ</button><button id="qB">GRÁFICOS: ALTOS</button><button id="exitB">SALIR AL MENÚ DE JUEGOS</button></div></div>
  <!-- fin -->
  <div class="screen" id="endS"><div class="panel"><h2>¡HAS SALVADO EL TALLER!</h2><p id="endTxt"></p><button id="endB" class="big">SEGUIR EXPLORANDO</button></div></div>
  <div id="fade"></div>
  <div id="loading"><div class="spin"></div><span id="loadTxt">Cargando el mundo…</span></div>
  <div id="err"></div>
</div>
<script src="js/three.min.js"></script>
<script src="js/BufferGeometryUtils.js"></script>
<script src="js/CopyShader.js"></script><script src="js/LuminosityHighPassShader.js"></script>
<script src="js/EffectComposer.js"></script><script src="js/RenderPass.js"></script><script src="js/ShaderPass.js"></script><script src="js/UnrealBloomPass.js"></script>
<script src="game/engine.js"></script>
<script src="game/music.js"></script>
<script src="game/chars.js"></script>
<script src="game/mobs.js"></script>
<script src="game/world.js"></script>
<script src="game/main.js"></script>
</body>
</html>
