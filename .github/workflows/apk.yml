name: Fabricar APK Juegos Neira
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon
      - name: Preparar
        run: cp android/app/build/outputs/apk/release/app-release.apk JuegosNeira.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Juegos Neira (versión ${{ github.run_number }})
          body: Descarga JuegosNeira.apk e instálala en el móvil. Solo hace falta una vez; los juegos se actualizan solos.
          make_latest: true
          files: JuegosNeira.apk
