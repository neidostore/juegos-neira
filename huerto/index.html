<script>
'use strict';
// ================== CORE ==================
const H = 900; let W = 1600;
const TW = 112, TH = 124, BX = 330, BY = 196, ROWS = 5, COLS = 9;
const BOARD_R = BX + COLS * TW;
const FONT = '"Luckiest Guy","Arial Black",Impact,sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
function wpick(o) { let s = 0; for (const k in o) s += o[k]; let r = Math.random() * s; for (const k in o) { r -= o[k]; if (r <= 0) return k; } return Object.keys(o)[0]; }
const cellCX = c => BX + c * TW + TW / 2;
const cellCY = r => BY + r * TH + TH / 2;
const footY = r => BY + r * TH + TH * 0.80;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOut = t => 1 - (1 - t) * (1 - t);
// seeded random for backgrounds
function srand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- save ----------
const SAVE_KEY = 'huertoNeiraVZ_v1';
let SAVE = { unlocked: 1, done: {}, coins: 0, seen: { hortelano: 1 }, best: 0, music: true, sfx: true, hints: {}, lastSel: null };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) Object.assign(SAVE, s); } catch (e) { }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { } }

// ================== ART HELPERS ==================
const OL = '#24170c';
const SS = 3;
function spr(w, h, ax, ay, fn) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
  const g = c.getContext('2d'); g.scale(SS, SS); g.translate(ax, ay);
  g.lineJoin = 'round'; g.lineCap = 'round';
  fn(g);
  c.w = w; c.h = h; c.ax = ax; c.ay = ay; return c;
}
function variant(s, color, op) {
  const c = document.createElement('canvas'); c.width = s.width; c.height = s.height;
  const g = c.getContext('2d'); g.drawImage(s, 0, 0);
  g.globalCompositeOperation = op || 'source-atop'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  c.w = s.w; c.h = s.h; c.ax = s.ax; c.ay = s.ay; return c;
}
function dsi(ctx, s) { ctx.drawImage(s, -s.ax, -s.ay, s.w, s.h); }
function ds(ctx, s, x, y, rot, sx, sy) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (sx != null) ctx.scale(sx, sy == null ? sx : sy);
  ctx.drawImage(s, -s.ax, -s.ay, s.w, s.h); ctx.restore();
}
function E(g, x, y, rx, ry, fill, stroke, lw, rot) {
  g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke !== null) { g.strokeStyle = stroke || OL; g.lineWidth = lw || 3; g.stroke(); }
}
function RG(g, x, y, r, c1, c2, c3) {
  const gr = g.createRadialGradient(x - r * .35, y - r * .4, r * .05, x, y, r * 1.1);
  gr.addColorStop(0, c1); if (c3) { gr.addColorStop(.6, c2); gr.addColorStop(1, c3); } else gr.addColorStop(1, c2); return gr;
}
function LG(g, x0, y0, x1, y1, ...cs) { const gr = g.createLinearGradient(x0, y0, x1, y1); cs.forEach((c, i) => gr.addColorStop(i / (cs.length - 1), c)); return gr; }
function shine(g, x, y, rx, ry, a, rot) { g.save(); g.globalAlpha = a == null ? .5 : a; E(g, x, y, rx, ry, '#fff', null, 0, rot == null ? -.5 : rot); g.restore(); }
function P(g, fn, fill, stroke, lw) { g.beginPath(); fn(g); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke !== null) { g.strokeStyle = stroke || OL; g.lineWidth = lw || 3; g.stroke(); } }
function RR(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function leaf(g, x, y, len, wid, rot, c1, c2) {
  g.save(); g.translate(x, y); g.rotate(rot);
  P(g, g => { g.moveTo(0, 0); g.quadraticCurveTo(len * .45, -wid, len, 0); g.quadraticCurveTo(len * .45, wid, 0, 0); }, LG(g, 0, 0, len, 0, c1 || '#7be35d', c2 || '#2c8a2a'), OL, 2.5);
  g.strokeStyle = 'rgba(20,70,20,.45)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(3, 0); g.quadraticCurveTo(len * .5, -wid * .15, len * .85, 0); g.stroke();
  g.restore();
}
function stemC(g, pts, w, color) {
  for (const [lw, c] of [[w + 5, OL], [w, color]]) { g.beginPath(); g.moveTo(pts[0], pts[1]); g.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]); g.strokeStyle = c; g.lineWidth = lw; g.stroke(); }
  g.beginPath(); g.moveTo(pts[0] - w * .2, pts[1]); g.quadraticCurveTo(pts[2] - w * .25, pts[3], pts[4] - w * .2, pts[5]); g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = w * .3; g.stroke();
}
function dropPath(g, x, y, s) {
  g.moveTo(x, y - s * 1.55); g.bezierCurveTo(x + s * .35, y - s * 1.0, x + s, y - s * .45, x + s, y + s * .15);
  g.arc(x, y + s * .15, s, 0, Math.PI, false);
  g.bezierCurveTo(x - s, y - s * .45, x - s * .35, y - s * 1.0, x, y - s * 1.55); g.closePath();
}
function drawDrop(g, x, y, s, lw) {
  VP(g, g => dropPath(g, x, y, s), RG(g, x, y, s * 1.3, '#d4f6ff', '#3fb2f5', '#1563c4'), x, y, s, s * 1.2, lw || 2.5, .6);
  shine(g, x - s * .38, y - s * .1, s * .22, s * .45, .8, .25);
}

// volume shading: ambient occlusion + bounce rim + soft specular, clipped to a path
function vol(g, pathFn, cx, cy, rx, ry, k) {
  k = k == null ? 1 : k; ry = ry || rx; const R = Math.max(rx, ry);

// ---------- PAUSE / WIN / LOSE ----------

// ================== MAIN ==================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

  VIEW.scale = Math.min(cw / W, ch / H); VIEW.ox = (cw - W * VIEW.scale) / 2; VIEW.oy = (ch - H * VIEW.scale) / 2;

let last = performance.now(), acc = 0, lastW = 0, lastH = 0, slowFrames = 0;
function loop(now) {
